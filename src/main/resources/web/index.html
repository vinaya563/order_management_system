<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OMS Test Application</title>
</head>
<body>

<h1>Order Management System</h1>

<section id="loginSection">
    <h2>Login</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginButton">Login</button>
    <div id="loginError"></div>
</section>

<section id="orderSection" hidden>
    <h2>Create Order</h2>
    <input id="productId" placeholder="Product ID">
    <input id="productName" placeholder="Product name">
    <input id="quantity" placeholder="Quantity">
    <input id="unitPrice" placeholder="Unit price">
    <button id="createOrderButton">Create Order</button>
    <div id="orderId"></div>
</section>

<section id="paymentSection" hidden>
    <h2>Payment</h2>
    <input id="cardNumber" placeholder="Card number">
    <button id="payButton">Pay</button>
    <div id="paymentError"></div>
</section>

<section id="confirmationSection" hidden>
    <h2>Confirmation</h2>
    <div id="confirmationMessage"></div>
    <div>Order ID: <span id="confirmationOrderId"></span></div>
    <div>Status: <span id="orderStatus"></span></div>
</section>

<script src="/app.js"></script>
</body>
</html>
